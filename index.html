<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMEX DeFi Protocol Exchange ⚡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f3ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .header-container {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 32px;
            max-width: 440px;
            padding: 0 20px;
        }
        .header-container h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1f2937;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.02);
        }
        .header-container p {
            color: #6b7280;
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
        }
        /* ИДЕАЛЬНЫЙ РОВНЫЙ КОНТЕЙНЕР ДЛЯ ВИДЖЕТА */
        #jupiter-terminal-container {
            width: 100%;
            max-width: 440px;
            min-height: 580px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            border: 1px solid #E5E7EB;
            background: #FFFFFF;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 40px;
        }
    </style>

    <!-- ИСПРАВЛЕНО: Теперь тут стоит точный адрес технического облачного скрипта Jupiter Terminal -->
    <script src="https://jup.ag" defer></script>

    <script>
        window.addEventListener('load', function() {
            if (window.Jupiter) {
                try {
                    window.Jupiter.init({
                        displayMode: "integrated", 
                        integratedTargetId: "jupiter-terminal-container",
                        // Ваша личная выделенная скоростная RPC-нода от Helius
                        endpoint: "https://mainnet.helius-rpc.com/?api-key=2e43f4b0-9f40-4b30-ab45-90e65d58191d", 

                        // Настройки токенов по умолчанию
                        formProps: {
                            initialInputMint: "So11111111111111111111111111111111111111112", // Начинаем обмен с SOL
                            initialOutputMint: "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs", // Ваш токен MEMEX по умолчанию
                        },

                        // Настройка вашей личной комиссии (Platform Fee)
                        feeConfig: {
                            feeBps: 30, // Ваша комиссия 0.3% с каждого обмена на вашем сайте
                            feeAccounts: [
                                // Слева системный адрес SOL, справа ваш личный Referral Key для сбора прибыли
                                ["So11111111111111111111111111111111111111112", "D7B1prmuB7izhvBWAhNMCaGbonH6WTrBpTuAZn1sMd7L"] 
                            ]
                        },

                        // ---- КРАСИВЫЙ СВЕТЛЫЙ DEFI ДИЗАЙН ВИДЖЕТА ----
                        theme: {
                            palette: {
                                mode: 'light',         // Внутренности виджета в светлом режиме
                                background: '#FFFFFF', // Чистый белый фон карточки обменника
                                primary: '#8B5CF6',    // Фиолетовый неоновый цвет главных Web3 кнопок
                                secondary: '#F3F4F6',  // Светло-серые аккуратные поля выбора токенов
                                text: '#1F2937',       // Темный легкочитаемый текст
                            },
                            shape: {
                                borderRadius: '16px',
                            },
                        }
                    });
                } catch (error) {
                    console.error("Ошибка при инициализации виджета Jupiter:", error);
                }
            }
        });
    </script>
</head>
<body>

    <div class="header-container">
        <h1>MEMEX DeFi Protocol Exchange ⚡</h1>
        <p>Swap Solana tokens instantly at the best rates</p>
    </div>
    
    <!-- Сюда скрипт Jupiter автоматически и ровно развернет интерфейс обмена -->
    <div id="jupiter-terminal-container"></div>

</body>
</html>
