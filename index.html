<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMEX DeFi Protocol Exchange</title>
    <style>
        body {
            background-color: #090A0E;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #13141A;
            border-bottom: 1px solid #1C1D24;
        }
        header .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        header .logo span { color: #C7F284; }
        header nav { display: flex; gap: 32px; font-size: 14px; font-weight: 600; }
        header nav a { color: #9CA3AF; text-decoration: none; transition: 0.2s; }
        header nav a:hover { color: #FFFFFF; }
        header .status { font-size: 13px; font-weight: 700; color: #C7F284; padding: 6px 14px; border-radius: 12px; background-color: rgba(199, 242, 132, 0.1); border: 1px solid rgba(199, 242, 132, 0.2); }
        main {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 50px 20px;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090a0e 70%);
            flex: 1;
        }
        .container-box {
            width: 100%;
            max-width: 440px;
            background: #13141A;
            border-radius: 24px;
            border: 1px solid #1C1D24;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .btn-jup {
            display: block;
            width: 100%;
            background-color: #C7F284;
            color: #090A0E;
            text-align: center;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(199, 242, 132, 0.4);
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-jup:hover { background-color: #bce674; transform: translateY(-1px); }
    </style>
</head>
<body>

    <header>
        <div class="logo">MEMEX <span>DeFi</span></div>
        <nav>
            <a href="https://wlakos.github.io/memes-assets/index-en.html" target="_blank">Whitepaper</a>
            <a href="https://wlakos.github.io/memes-assets/manifest-en.html" target="_blank">MONUMENTAL MANIFESTO</a>

    <main>

            <iframe src="https://dexscreener.com/solana/3t5wyfwbwsudqpv1h1qn7cv87aes3ej3qpzqrnjjstmy" style="width: 100%; height: 100%; border: none;"></iframe>

        <!-- Гладкий блок оригинального обмена Jupiter -->
        <div style="display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 440px;">
            <div style="padding-left: 8px;">
                <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0;">Official Swap Hub</h2>
                <p style="color: #9CA3AF; font-size: 14px; margin: 0;">Trade any tokens at the best rates via Jupiter Protocol with a built-in 0.3% fee supporting MEMEX liquidity.</p>
            </div>
            
            <div class="container-box" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
                <div style="background-color: #1C1D24; padding: 16px; border-radius: 12px; border: 1px solid #2C2D35; text-align: center;">
                    <p style="margin: 0; color: #9CA3AF; font-size: 14px;">To trade MEMEX with auto-applied fee, use our official aggregated router below.</p>
                </div>
                
                <!-- 💥 ОФИЦИАЛЬНАЯ ССЫЛКА НА ОБМЕН: ЗАРЯЖЕНА ВСЕМИ ТВОИМИ ОНЧЕЙН-ПАРАМЕТРАМИ -->
                <a href="https://jup.ag" target="_blank" class="btn-jup">

                </a>
            </div>

</body>
</html>
