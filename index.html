<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMEX DeFi Protocol Exchange ⚡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #090A0E;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* 1. БЕГУЩАЯ СТРОКА */
        .ticker-wrap {
            width: 100%;
            background-color: #111c14;
            border-bottom: 1px solid #14291b;
            overflow: hidden;
            padding: 6px 0;
        }
        .ticker {
            display: flex;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 30px;
            font-size: 12px;
            font-weight: 700;
            color: #9CA3AF;
            letter-spacing: 0.5px;
        }
        .ticker-item span { color: #C7F284; margin-left: 4px; }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #13141A;
            border-bottom: 1px solid #1C1D24;
        }
        header .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        header .logo span { color: #C7F284; }
        header nav { display: flex; gap: 32px; font-size: 14px; font-weight: 600; align-items: center; }
        header nav a { color: #9CA3AF; text-decoration: none; transition: 0.2s; }
        header nav a:hover { color: #FFFFFF; }
        
        /* СОЦСЕТИ */
        .social-link {
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-tg { color: #26A5E4; border: 1px solid rgba(38, 165, 228, 0.3); background: rgba(38, 165, 228, 0.05); }
        .social-tg:hover { background: rgba(38, 165, 228, 0.15); box-shadow: 0 0 12px rgba(38, 165, 228, 0.4); }
        .social-x { color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.03); }
        .social-x:hover { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 12px rgba(255, 255, 255, 0.3); }

        .status { font-size: 13px; font-weight: 700; color: #C7F284; padding: 6px 14px; border-radius: 12px; background-color: rgba(199, 242, 132, 0.1); border: 1px solid rgba(199, 242, 132, 0.2); }
        
        main {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 50px 20px;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090a0e 70%);
            flex: 1;
        }

        /* КОЛОНКИ САЙТА */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }
        .swap-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 440px;
        }

        /* 4. КАРТОЧКИ СТАТИСТИКИ ТОКЕНА */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
        }
        .stat-card {
            background-color: #13141A;
            border: 1px solid #1C1D24;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .stat-title { font-size: 11px; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .stat-value { font-size: 16px; font-weight: 800; color: #FFFFFF; }
        .stat-value span { color: #14F195; }

        #jupiter-terminal-container {
            width: 100%;
            max-width: 440px;
            min-height: 580px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid #1C1D24;
            background: #13141A;
            padding: 6px;
            box-sizing: border-box;
        }
        .btn-jup {
            display: block;
            width: 100%;
            background-color: #C7F284;
            color: #090A0E;
            text-align: center;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(199, 242, 132, 0.3);
            transition: 0.2s;
            box-sizing: border-box;
            margin-top: 8px;
        }
        .btn-jup:hover { background-color: #bce674; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(199, 242, 132, 0.5); }

        /* БЛОК СМАРТ-КОНТРАКТА */
        .ca-container {
            background-color: #13141A;
            border: 1px solid #1C1D24;
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            margin-top: 12px;
        }
        .ca-text-box { display: flex; flex-direction: column; gap: 4px; overflow: hidden; width: 75%; }
        .ca-label { font-size: 11px; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .ca-value { font-size: 13px; font-weight: 600; color: #9CA3AF; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; font-family: monospace; }
        .btn-copy {
            background-color: #1C1D24;
            border: 1px solid #2C2D35;
            color: #C7F284;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-copy:hover { background-color: #2C2D35; color: #FFFFFF; }
    </style>

    <script src="https://jup.ag" defer></script>

    <script>
        window.addEventListener('load', function() {
            if (window.Jupiter) {
                try {
                    window.Jupiter.init({
                        displayMode: "integrated", 
                        integratedTargetId: "jupiter-terminal-container",
                        endpoint: "https://helius-rpc.com", 
                        formProps: {
                            initialInputMint: "So11111111111111111111111111111111111111112", 
                            initialOutputMint: "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs", 
                        },
                        feeConfig: {
                            feeBps: 30, 
                            feeAccounts: [
                                ["So11111111111111111111111111111111111111112", "D7B1prmuB7izhvBWAhNMCaGbonH6WTrBpTuAZn1sMd7L"] 
                            ]
                        },
                        theme: {
                            palette: {
                                mode: 'dark',           
                                background: '#13141A',  
                                primary: '#C7F284',     
                                secondary: '#1C1D24',   
                                text: '#FFFFFF',        
                            },
                            shape: { borderRadius: '20px' }
                        }
                    });
                } catch (error) {
                    console.error("Ошибка при инициализации виджета Jupiter:", error);
                }
            }
        });

        function copyContract() {
            const ca = "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs";
            navigator.clipboard.writeText(ca).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerText = "Copied! ✓";
                btn.style.color = "#14F195";
                setTimeout(() => {
                    btn.innerText = "Copy";
                    btn.style.color = "#C7F284";
                }, 2000);
            });
        }
    </script>
