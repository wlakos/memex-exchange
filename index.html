<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMEX DeFi Protocol Exchange ⚡</title>
    <style>
        body {
            background-color: #090A0E;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #13141A;
            border-bottom: 1px solid #1C1D24;
        }
        header .logo { font-size: 20px; font-weight: 800; }
        header .logo span { color: #C7F284; }
        header nav { display: flex; gap: 32px; font-size: 14px; font-weight: 600; }
        header nav a { color: #9CA3AF; text-decoration: none; }
        header .status { font-size: 13px; font-weight: 700; color: #C7F284; padding: 6px 14px; border-radius: 12px; background-color: rgba(199, 242, 132, 0.1); border: 1px solid rgba(199, 242, 132, 0.2); }
        main {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 50px 20px;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090a0e 70%);
            flex: 1;
        }
    </style>

    <!-- ПОДКЛЮЧАЕМ ОФИЦИАЛЬНЫЙ ОНЛАЙН-ВИДЖЕТ JUPITER -->
    <script src="https://jup.ag" defer></script>

    <script>
        window.addEventListener('load', function() {
            if (window.Jupiter) {
                window.Jupiter.init({
                    displayMode: "integrated",
                    integratedTargetId: "jupiter-terminal-container",
                    endpoint: "https://solana.com", // Подключение к блокчейну
                    formProps: {
                        initialInputMint: "So11111111111111111111111111111111111111112", // Начинаем с SOL
                        initialOutputMint: "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs" // Твой токен MEMEX по умолчанию
                    },
                    feeConfig: {
                        feeBps: 30, // Вшиваем твою наценку ровно 0.3%
                        feeAccounts: [
                            // Твой подтвержденный ключ со скриншота для сбора прибыли:
                            ["So11111111111111111111111111111111111111112", "D7B1prmuB7izhvBWAhNMCaGbonH6WTrBpTuAZn1sMd7L"]
                        ]
                    },
                    theme: {
                        palette: {
                            mode: 'dark',
                            background: '#13141A',
                            primary: '#C7F284', // Салатовые гладкие кнопки, как у оригинального JUP
                            secondary: '#1C1D24',
                            text: '#FFFFFF'
                        },
                        shape: { borderRadius: '20px' }
                    }
                });
            }
        });
    </script>
</head>
<body>

    <header>
        <div class="logo">MEMEX <span>DeFi</span></div>
        <nav>
            <a href="https://github.io" target="_blank">Whitepaper</a>
            <a href="https://github.io" target="_blank">Airdrop Portal</a>
        </nav>
        <div class="status">● Solana Mainnet</div>
    </header>

    <main>
        <!-- Левая часть: Живой темный график твоего токена MEMEX -->
        <div style="width: 100%; max-width: 720px; height: 540px; border-radius: 20px; overflow: hidden; border: 1px solid #1C1D24;">
            <iframe src="https://dexscreener.com" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <!-- Правая часть: Сюда код сам развернет космический встроенный терминал -->
        <div style="display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 440px;">
            <div style="padding-left: 8px;">
                <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0;">Official Swap Hub</h2>
                <p style="color: #9CA3AF; font-size: 14px; margin: 0;">Trade directly through Jupiter router with 0.3% protocol fee supporting MEMEX.</p>
            </div>
            
            <!-- Контейнер для «гладкого» виджета -->
            <div id="jupiter-terminal-container" style="width: 100%; min-height: 520px;"></div>
        </div>
    </main>

</body>
</html>
