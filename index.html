<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMEX DeFi Protocol Exchange ⚡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #090A0E;
            color: #FFFFFF;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #13141A;
            border-bottom: 1px solid #1C1D24;
        }
        header .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        header .logo span { color: #C7F284; }
        header nav { display: flex; gap: 32px; font-size: 14px; font-weight: 600; }
        header nav a { color: #9CA3AF; text-decoration: none; transition: 0.2s; }
        header nav a:hover { color: #FFFFFF; }
        header .status { font-size: 13px; font-weight: 700; color: #C7F284; padding: 6px 14px; border-radius: 12px; background-color: rgba(199, 242, 132, 0.1); border: 1px solid rgba(199, 242, 132, 0.2); }
        main {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 50px 20px;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090a0e 70%);
            flex: 1;
        }
        .swap-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 440px;
        }
        /* ОРИГИНАЛЬНЫЙ СГЛАЖЕННЫЙ КОНТЕЙНЕР JUPITER */
        #jupiter-terminal-container {
            width: 100%;
            max-width: 440px;
            min-height: 580px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid #1C1D24;
            background: #13141A;
            padding: 6px;
            box-sizing: border-box;
        }
    </style>

    <!-- ИСПРАВЛЕНО: Указана точная техническая ссылка на ядро загрузки виджета! -->
    <script src="https://jup.ag" defer></script>

    <script>
        window.addEventListener('load', function() {
            if (window.Jupiter) {
                try {
                    window.Jupiter.init({
                        displayMode: "integrated", 
                        integratedTargetId: "jupiter-terminal-container",
                        // Твоя личная скоростная RPC-нода от Helius
                        endpoint: "https://mainnet.helius-rpc.com/?api-key=2e43f4b0-9f40-4b30-ab45-90e65d58191d", 

                        // Настройки токенов по умолчанию
                        formProps: {
                            initialInputMint: "So11111111111111111111111111111111111111112", // Начинаем обмен с SOL
                            initialOutputMint: "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs", // Твой токен MEMEX по умолчанию
                        },

                        // Настройка твоей личной реферальной комиссии 0.3%
                        feeConfig: {
                            feeBps: 30, 
                            feeAccounts: [
                                ["So11111111111111111111111111111111111111112", "D7B1prmuB7izhvBWAhNMCaGbonH6WTrBpTuAZn1sMd7L"] 
                            ]
                        },

                        // ---- ОРИГИНАЛЬНЫЙ КОСМИЧЕСКИЙ ДИЗАЙН JUP.AG ----
                        theme: {
                            palette: {
                                mode: 'dark',           
                                background: '#13141A',  // Цвет карточки оригинального swap-интерфейса
                                primary: '#C7F284',     // Фирменная ядовито-салатовая кнопка Swap
                                secondary: '#1C1D24',   // Темные сглаженные поля ввода
                                text: '#FFFFFF',        
                            },
                            shape: {
                                borderRadius: '20px',
                            },
                        }
                    });
                } catch (error) {
                    console.error("Ошибка при инициализации виджета Jupiter:", error);
                }
            }
        });
    </script>
</head>
<body>

    <header>
        <div class="logo">MEMEX <span>DeFi</span></div>
        <nav>
            <a href="https://github.io" target="_blank">Whitepaper</a>
            <a href="https://github.io" target="_blank">MONUMENTAL MANIFESTO</a>
        </nav>
        <div class="status">● Solana Mainnet</div>
    </header>

    <main>
        <!-- Левая часть: Живой темный график твоего токена MEMEX -->
        <div style="width: 100%; max-width: 720px; height: 540px; border-radius: 20px; overflow: hidden; border: 1px solid #1C1D24; boxShadow: '0 20px 40px rgba(0,0,0,0.4)'">
            <iframe src="https://dexscreener.com" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <!-- Правая часть: Блок обменника, куда плавно встанет виджет Юпитера -->
        <div class="swap-wrapper">
            <div style="padding-left: 8px;">
                <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 6px 0;">Official Swap Hub</h2>
                <p style="color: #9CA3AF; font-size: 14px; margin: 0;">Trade any tokens at the best rates via Jupiter Protocol with a built-in 0.3% fee supporting MEMEX liquidity.</p>
            </div>
            
            <!-- Сюда встанет ультра-гладкий темный терминал -->
            <div id="jupiter-terminal-container"></div>
        </div>
    </main>

</body>
</html>
